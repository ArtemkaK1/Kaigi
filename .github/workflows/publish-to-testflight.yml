name: Publish to TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: meetrail-testflight
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: xcode-27
    environment: testflight
    timeout-minutes: 60
    env:
      FASTLANE_SKIP_UPDATE_CHECK: '1'
      FASTLANE_HIDE_CHANGELOG: '1'
      FASTLANE_OPT_OUT_USAGE: '1'
      FASTLANE_SKIP_DOCS: '1'
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      APP_IDENTIFIER: ${{ vars.APP_IDENTIFIER }}
    steps:
      - name: Check out main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Verify Apple Silicon and Xcode 27
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          xcode-select -p
          xcodebuild -version
          xcodebuild -version | head -n 1 | grep -Eq '^Xcode 27([.]|$)'
          xcrun swift --version
          xcrun --sdk macosx --show-sdk-version
          xcodebuild -help > "$RUNNER_TEMP/xcodebuild-help.txt" 2>&1
          grep -q 'app-store-connect' "$RUNNER_TEMP/xcodebuild-help.txt"

      - name: Install locked Ruby dependencies
        uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: CI configuration checks
        run: |
          ruby -c fastlane/Fastfile
          ruby -c fastlane/Appfile
          bundle exec ruby fastlane/ci_support_test.rb
          python3 -m unittest discover -s fastlane -p '*_test.py'

      - name: Architecture, Debug build, deterministic unit tests, Release build
        run: bundle exec fastlane mac verify

      - name: Archive, automatic signing, package verification, TestFlight upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        shell: bash
        run: |
          set -euo pipefail
          export TMPDIR="$RUNNER_TEMP/meetrail-publish-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -m 700 "$TMPDIR"
          trap 'rm -rf -- "$TMPDIR"' EXIT
          export ASC_API_KEY_PATH="$TMPDIR/AuthKey.p8"
          umask 077
          printf '%s' "$ASC_API_KEY_P8" > "$ASC_API_KEY_PATH"
          chmod 600 "$ASC_API_KEY_PATH"
          bundle exec fastlane mac beta

      - name: Clean temporary credentials
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/meetrail-publish-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

      - name: Report workflow result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          printf '\nWorkflow result: **%s**. See the individual stages above.\n' "$JOB_STATUS" >> "$GITHUB_STEP_SUMMARY"
          printf 'Apple processing and tester availability must be confirmed in App Store Connect.\n' >> "$GITHUB_STEP_SUMMARY"

name: Publish to TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: meetrail-testflight
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: xcode-27
    environment: testflight
    timeout-minutes: 60
    outputs:
      build_number: ${{ steps.publish_release.outputs.build_number }}
      marketing_version: ${{ steps.publish_release.outputs.marketing_version }}
    env:
      FASTLANE_SKIP_UPDATE_CHECK: '1'
      FASTLANE_HIDE_CHANGELOG: '1'
      FASTLANE_OPT_OUT_USAGE: '1'
      FASTLANE_SKIP_DOCS: '1'
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      APP_IDENTIFIER: ${{ vars.APP_IDENTIFIER }}
    steps:
      - name: Check out main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Verify Apple Silicon and Xcode 27
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          xcode-select -p
          xcodebuild -version
          xcodebuild -version | head -n 1 | grep -Eq '^Xcode 27([.]|$)'
          xcrun swift --version
          xcrun --sdk macosx --show-sdk-version
          xcodebuild -help > "$RUNNER_TEMP/xcodebuild-help.txt" 2>&1
          grep -q 'app-store-connect' "$RUNNER_TEMP/xcodebuild-help.txt"

      - name: Install locked Ruby dependencies
        uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: CI configuration checks
        run: |
          ruby -c fastlane/Fastfile
          ruby -c fastlane/Appfile
          bundle exec ruby fastlane/ci_support_test.rb
          python3 -m unittest discover -s fastlane -p '*_test.py'

      - name: Architecture, Debug build, deterministic unit tests, Release build
        run: bundle exec fastlane mac verify

      - name: Archive, automatic signing, package verification, TestFlight upload
        id: publish_release
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        shell: bash
        run: |
          set -euo pipefail
          export TMPDIR="$RUNNER_TEMP/meetrail-publish-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -m 700 "$TMPDIR"
          trap 'rm -rf -- "$TMPDIR"' EXIT
          export ASC_API_KEY_PATH="$TMPDIR/AuthKey.p8"
          umask 077
          printf '%s' "$ASC_API_KEY_P8" > "$ASC_API_KEY_PATH"
          chmod 600 "$ASC_API_KEY_PATH"
          bundle exec fastlane mac beta

      - name: Clean temporary credentials
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/meetrail-publish-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

      - name: Report publishing result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          printf '\nPublishing job result: **%s**. Build-number write-back is reported separately.\n' "$JOB_STATUS" >> "$GITHUB_STEP_SUMMARY"
          printf 'Apple processing and tester availability must be confirmed in App Store Connect.\n' >> "$GITHUB_STEP_SUMMARY"

  prepare-next-build:
    name: Prepare next build number on main
    needs: publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out current main for build-number write-back
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: true

      - name: Prepare and push the next build number
        env:
          UPLOADED_BUILD_NUMBER: ${{ needs.publish.outputs.build_number }}
          MARKETING_VERSION: ${{ needs.publish.outputs.marketing_version }}
          RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          project_file=Meetrail.xcodeproj/project.pbxproj
          python3 fastlane/prepare_next_build.py "$project_file" "$UPLOADED_BUILD_NUMBER" "$MARKETING_VERSION" | tee -a "$GITHUB_STEP_SUMMARY"
          git diff --check
          if git diff --quiet -- "$project_file"; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          next_build_number="$((UPLOADED_BUILD_NUMBER + 1))"
          git add -- "$project_file"
          git commit -m "ci: prepare build $next_build_number" -m "After TestFlight upload $MARKETING_VERSION ($UPLOADED_BUILD_NUMBER) from $RELEASE_SHA."
          git push origin HEAD:main
          printf '\nNext build **%s** prepared on main after upload **%s**. Apple processing remains separate.\n' "$next_build_number" "$UPLOADED_BUILD_NUMBER" >> "$GITHUB_STEP_SUMMARY"

      - name: Report build-number write-back failure
        if: failure()
        run: |
          printf '\n**Build-number write-back failed after the TestFlight upload succeeded.** Check branch permissions or a concurrent main update, then rerun only the failed job.\n' >> "$GITHUB_STEP_SUMMARY"
